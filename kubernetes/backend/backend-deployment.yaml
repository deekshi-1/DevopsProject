apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: webapp

spec:

  replicas: 2

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: backend


  template:

    metadata:
      labels:
        app: backend


    spec:

      imagePullSecrets:
      - name: dockerhub-secret


      containers:

      - name: backend

        image: deekshithc1/backend:latest

        imagePullPolicy: Always


        ports:
        - containerPort: 7000


        envFrom:
        - configMapRef:
            name: backend-config

        - secretRef:
            name: backend-secret    


        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi



        readinessProbe:

          httpGet:

            path: /api/healthcheck
            port: 7000

          initialDelaySeconds: 10
          periodSeconds: 10



        livenessProbe:

          httpGet:

            path: /api/healthcheck
            port: 7000

          initialDelaySeconds: 30
          periodSeconds: 20