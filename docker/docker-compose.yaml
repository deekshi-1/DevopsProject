version: "3.9"

services:
  frontend:
    build:
      context: ../application/frontend
      dockerfile: Dockerfile
    container_name: frontend  
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_network   

  backend:
    build:
      context: ../application/backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      NODE_ENV: production
      PORT: 7000
    networks:
      - app_network

networks:
  app_network:
    driver: bridge